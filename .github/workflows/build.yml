name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # The determinism check is the single most important guarantee in the
  # codebase: same seed + same commands -> byte-identical state on every
  # platform we support. macOS-only passing proves nothing for lockstep
  # netcode; the Windows runner is the real test.
  determinism:
    name: determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: restore
        run: dotnet restore Sim.Tests/WarGame.Sim.Tests.csproj

      - name: test
        run: dotnet test Sim.Tests/WarGame.Sim.Tests.csproj --no-restore --logger "console;verbosity=normal"

  # Tiny prep job: tells the godot-export job whether export_presets.cfg has
  # been committed yet. We cannot use hashFiles() in a job-level `if:` because
  # that condition is evaluated by GitHub's controller before any runner is
  # allocated — and hashFiles() requires a runner with the repo checked out.
  check-presets:
    name: check export presets
    runs-on: ubuntu-latest
    outputs:
      has-presets: ${{ steps.check.outputs.has-presets }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f export_presets.cfg ]; then
            echo "has-presets=true" >> "$GITHUB_OUTPUT"
            echo "::notice::export_presets.cfg found; godot-export will run"
          else
            echo "has-presets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::export_presets.cfg not found; godot-export will be skipped (commit one to enable Mac/Windows binary builds)"
          fi

  # Cross-platform binary builds. Activates once export_presets.cfg is in the
  # repo (committed after running Godot's Project > Export dialog and adding
  # Windows Desktop + macOS presets).
  #
  # firebelley/godot-export installs Godot 4.6.2 .NET, downloads the matching
  # export templates, and runs --export-release for each preset.
  godot-export:
    name: godot export
    needs: [determinism, check-presets]
    if: needs.check-presets.outputs.has-presets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: build .NET
        run: dotnet build WarGame.csproj -c ExportRelease

      - name: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          use_godot_4: true

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wargame-builds
          path: /home/runner/.local/share/godot/archives/*
          if-no-files-found: warn
